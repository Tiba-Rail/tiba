name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      # `npm ci` refuses this lockfile: Tailwind's wasm fallback pulls optional packages that
      # npm on Windows will not write into the lock, so the lock can never satisfy it. `npm install`
      # still honours the lock, it just tolerates the gap. Revert to `npm ci` once the lock is
      # regenerated on Linux.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
