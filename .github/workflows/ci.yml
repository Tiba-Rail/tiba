name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions run at a fixed commit, not a movable tag (#4). Dependabot proposes
      # SHA bumps; the trailing comment names the release the SHA belongs to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Dependency install scripts run later in this job; they get no git credentials.
          persist-credentials: false
      # A tracked .env file is how a Vercel token reached this public repo (#1). Fail the build
      # if any env file other than the placeholder template is committed again.
      - name: No tracked env files
        run: "! git ls-files -- '.env*' ':(exclude).env.example' | grep ."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
      # Installs exactly what package-lock.json records, with its integrity hashes, and fails if
      # the lock and package.json disagree. Never resolves newer versions.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
