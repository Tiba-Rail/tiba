name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      # Tailwind's wasm fallback packages are optional, never used on the runner, and npm
      # cannot write them into the lockfile from Windows. Skipping them keeps npm ci strict.
      - run: npm ci --omit=optional
      - run: npm run typecheck
      - run: npm test
