# Updates arrive as reviewable pull requests, each run through CI. Dependabot regenerates
# package-lock.json on Linux, so the lock stays valid for `npm ci`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
